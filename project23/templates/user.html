{% extends "base.html" %}

{% block content %}
<h2 class="mb-4">User Panel</h2>

<form method="GET" class="mb-4">
    <input type="text" name="search" class="form-control" placeholder="Search books..." value="{{ query }}">
</form>

<table class="table table-striped table-hover shadow">
    <thead class="table-dark">
        <tr>
            <th>Title</th>
            <th>Author</th>
            <th>Year</th>
        </tr>
    </thead>
    <tbody>
        {% for book in books %}
        <tr>
            <td>{{ book.title }}</td>
            <td>{{ book.author }}</td>
            <td>{{ book.year }}</td>
        </tr>
        {% endfor %}
    </tbody>
</table>

{% endblock %}
