{% extends "base.html" %}

{% block content %}
<h2 class="mb-4">Admin Panel</h2>

<div class="card p-4 shadow mb-4">
    <h5>Add New Book</h5>
    <form method="POST">
        <input type="text" name="title" class="form-control mb-2" placeholder="Book Title" required>
        <input type="text" name="author" class="form-control mb-2" placeholder="Author" required>
        <input type="number" name="year" class="form-control mb-2" placeholder="Year" required>
        <button class="btn btn-success">Add Book</button>
    </form>
</div>

<table class="table table-bordered shadow">
    <thead class="table-warning">
        <tr>
            <th>Title</th>
            <th>Author</th>
            <th>Year</th>
        </tr>
    </thead>
    <tbody>
        {% for book in books %}
        <tr>
            <td>{{ book.title }}</td>
            <td>{{ book.author }}</td>
            <td>{{ book.year }}</td>
        </tr>
        {% endfor %}
    </tbody>
</table>

{% endblock %}
